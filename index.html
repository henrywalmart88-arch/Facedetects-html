<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FaceDetect Live</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000; color:#00ff88;
    font-family:'Share Tech Mono',monospace;
    height:100vh; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .header {
    position:fixed; top:0; left:0; right:0;
    padding:12px 20px;
    background:rgba(0,0,0,0.85);
    border-bottom:1px solid rgba(0,255,136,0.2);
    display:flex; justify-content:space-between;
    align-items:center; z-index:100;
  }
  .logo { font-family:'Orbitron',monospace; font-size:16px; font-weight:700; letter-spacing:4px; }
  .logo span { color:#ff4466; }
  .badge {
    font-size:10px; letter-spacing:2px;
    padding:4px 10px; border-radius:3px;
    background:#ff4466; color:#fff;
    animation:blink 1s infinite;
  }
  .badge.live { background:#00ff88; color:#000; animation:none; }
  @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.3} }

  .video-wrap { position:relative; width:100vw; height:100vh; }
  video {
    width:100%; height:100%; object-fit:cover;
    transform:scaleX(-1);
  }
  canvas {
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    transform:scaleX(-1);
  }

  /* Corner decorations */
  .corner {
    position:absolute; width:22px; height:22px;
    border-color:rgba(0,255,136,0.7); border-style:solid;
    z-index:50;
  }
  .tl { top:65px; left:10px; border-width:2px 0 0 2px; }
  .tr { top:65px; right:10px; border-width:2px 2px 0 0; }
  .bl { bottom:75px; left:10px; border-width:0 0 2px 2px; }
  .br { bottom:75px; right:10px; border-width:0 2px 2px 0; }

  .hud {
    position:fixed; bottom:0; left:0; right:0;
    padding:12px 20px;
    background:rgba(0,0,0,0.85);
    border-top:1px solid rgba(0,255,136,0.2);
    display:flex; justify-content:space-between;
    align-items:center; z-index:100;
  }
  .hud-item { display:flex; flex-direction:column; gap:2px; }
  .hud-label { font-size:9px; color:rgba(0,255,136,0.4); letter-spacing:2px; }
  .hud-value { font-size:18px; font-weight:bold; color:#00ff88; }

  /* Loading screen */
  #loadScreen {
    position:fixed; inset:0; background:#000;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:20px; z-index:999;
  }
  .load-logo { font-family:'Orbitron',monospace; font-size:26px; font-weight:700; letter-spacing:6px; }
  .load-logo span { color:#ff4466; }
  .bar-wrap { width:240px; height:2px; background:rgba(0,255,136,0.15); }
  .bar { height:100%; background:#00ff88; width:0%; transition:width 0.4s ease; }
  .load-msg { font-size:11px; color:rgba(0,255,136,0.5); letter-spacing:2px; text-align:center; }
  .err { color:#ff4466 !important; }
</style>
</head>
<body>

<div id="loadScreen">
  <div class="load-logo">FACE<span>DETECT</span></div>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  <div class="load-msg" id="msg">INITIALIZING...</div>
</div>

<div class="header">
  <div class="logo">FACE<span>DETECT</span></div>
  <div class="badge" id="badge">LOADING</div>
</div>

<div class="video-wrap">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
</div>

<div class="hud">
  <div class="hud-item">
    <div class="hud-label">FACES</div>
    <div class="hud-value" id="faceCount">0</div>
  </div>
  <div class="hud-item" style="text-align:center">
    <div class="hud-label">CONFIDENCE</div>
    <div class="hud-value" id="conf">—</div>
  </div>
  <div class="hud-item" style="text-align:right">
    <div class="hud-label">STATUS</div>
    <div class="hud-value" id="status">READY</div>
  </div>
</div>

<script type="module">
import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js";

const bar    = document.getElementById('bar');
const msg    = document.getElementById('msg');
const loadSc = document.getElementById('loadScreen');
const badge  = document.getElementById('badge');
const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const fcEl   = document.getElementById('faceCount');
const confEl = document.getElementById('conf');
const statEl = document.getElementById('status');

function setBar(pct, text) {
  bar.style.width = pct + '%';
  msg.textContent = text;
}

function fatal(text) {
  msg.textContent = text;
  msg.classList.add('err');
}

let detector = null;
let lastTime = -1;

async function init() {
  try {
    setBar(15, 'LOADING MEDIAPIPE...');
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
    );

    setBar(50, 'LOADING FACE MODEL...');
    detector = await FaceDetector.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      minDetectionConfidence: 0.5
    });

    setBar(80, 'STARTING CAMERA...');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'user', width:{ideal:1280}, height:{ideal:720} },
      audio: false
    });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);

    setBar(100, 'READY!');
    setTimeout(() => {
      loadSc.style.display = 'none';
      badge.textContent = 'LIVE';
      badge.classList.add('live');
      requestAnimationFrame(detect);
    }, 500);

  } catch(e) {
    fatal('ERROR: ' + e.message);
    console.error(e);
  }
}

function resizeCanvas() {
  canvas.width  = video.videoWidth  || window.innerWidth;
  canvas.height = video.videoHeight || window.innerHeight;
  canvas.style.width  = video.offsetWidth  + 'px';
  canvas.style.height = video.offsetHeight + 'px';
}

function detect(now) {
  requestAnimationFrame(detect);
  if (!detector || video.readyState < 2) return;
  if (now === lastTime) return;
  lastTime = now;

  resizeCanvas();

  const sx = canvas.width  / (video.videoWidth  || 1);
  const sy = canvas.height / (video.videoHeight || 1);

  let results;
  try {
    results = detector.detectForVideo(video, performance.now());
  } catch(e) { return; }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const dets = results.detections || [];
  fcEl.textContent = dets.length;

  if (dets.length === 0) {
    confEl.textContent = '—';
    statEl.textContent = 'SCANNING';
  } else {
    let best = 0;
    dets.forEach((det, i) => {
      const b  = det.boundingBox;
      const sc = det.categories?.[0]?.score || 0;
      if (sc > best) best = sc;

      const x = b.originX * sx;
      const y = b.originY * sy;
      const w = b.width   * sx;
      const h = b.height  * sy;

      // Glow rectangle
      ctx.shadowColor = '#00ff88';
      ctx.shadowBlur  = 18;
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth   = 2;
      ctx.strokeRect(x, y, w, h);

      // Corner accents
      const c = 18;
      ctx.lineWidth = 3;
      [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([cx,cy,dx,dy]) => {
        ctx.beginPath();
        ctx.moveTo(cx+dx*c, cy);
        ctx.lineTo(cx, cy);
        ctx.lineTo(cx, cy+dy*c);
        ctx.stroke();
      });

      // Label
      ctx.shadowBlur = 0;
      const label = `FACE ${i+1}  ${Math.round(sc*100)}%`;
      ctx.font = 'bold 13px monospace';
      const tw = ctx.measureText(label).width + 16;
      ctx.fillStyle = 'rgba(0,20,10,0.75)';
      ctx.fillRect(x, y-26, tw, 22);
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y-26, tw, 22);
      ctx.fillStyle = '#00ff88';
      ctx.fillText(label, x+8, y-9);

      // Keypoints
      if (det.keypoints) {
        ctx.fillStyle = 'rgba(0,255,136,0.7)';
        ctx.shadowBlur = 4;
        det.keypoints.forEach(kp => {
          ctx.beginPath();
          ctx.arc(kp.x * canvas.width * sx, kp.y * canvas.height * sy, 3, 0, Math.PI*2);
          ctx.fill();
        });
      }
    });

    confEl.textContent = Math.round(best*100) + '%';
    statEl.textContent = dets.length > 1 ? `${dets.length} LOCKED 🔒` : 'LOCKED 🔒';
  }
}

init();
</script>
</body>
</html>
